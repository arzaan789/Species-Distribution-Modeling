[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-sdm"
version = "0.1.0"
description = "Provenance-aware target-group backgrounds for presence-only SDMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "PyYAML>=6.0",
    "requests>=2.32",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "responses>=0.25",
]

[project.scripts]
provenance-sdm = "provenance_sdm.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
